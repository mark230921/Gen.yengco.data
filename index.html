<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Suggestions · 7-Eleven Gen. Yengco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5f3;
            --surface: #ffffff;
            --ink: #17211b;
            --muted: #5d6b63;
            --line: #e1e6e2;
            --accent: #00703c;
            --accent-hover: #005c32;
            --on-accent: #ffffff;
            --danger: #c8312b;
            --focus: rgba(0, 112, 60, 0.22);
            --shadow: 0 1px 2px rgba(23, 33, 27, 0.04), 0 12px 32px rgba(23, 33, 27, 0.06);
            --brand-orange: #f58220;
            --brand-green: #00873e;
            --brand-red: #ee2a24;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e130f;
                --surface: #161d18;
                --ink: #edf2ee;
                --muted: #98a79e;
                --line: #27322a;
                --accent: #46c083;
                --accent-hover: #5bd095;
                --on-accent: #0b1a11;
                --danger: #ef6b64;
                --focus: rgba(70, 192, 131, 0.28);
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
            }
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--ink);
            font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 720px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 36px 28px 12px;
            overflow: hidden;
        }

        /* Brand stripe */
        .card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 4px;
            background: linear-gradient(
                90deg,
                var(--brand-orange) 0 33.33%,
                var(--brand-green) 33.33% 66.66%,
                var(--brand-red) 66.66% 100%
            );
        }

        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .store {
            margin: 0 0 4px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
        }

        h1 {
            margin: 0;
            font-size: 26px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .btn {
            flex: none;
            height: 40px;
            padding: 0 18px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn:hover:not(:disabled) { background: var(--accent-hover); }
        .btn:active:not(:disabled) { transform: scale(0.985); }

        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px var(--focus);
        }

        .btn:disabled {
            background: var(--line);
            color: var(--muted);
            cursor: not-allowed;
        }

        .count {
            margin: 0 0 8px;
            min-height: 21px;
            font-size: 13px;
            color: var(--muted);
        }

        /* Table */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin: 0 -2px;
            padding: 0 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
        }

        th {
            padding: 10px 14px 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            white-space: nowrap;
        }

        td {
            padding: 16px 14px 16px 0;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        td:first-child {
            white-space: nowrap;
            color: var(--muted);
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        tbody tr:last-child td { border-bottom: 0; }

        /* Status */
        .status {
            padding: 40px 0 36px;
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .status.error { color: var(--danger); }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 10px;
            vertical-align: -3px;
            border: 2px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .card { padding: 32px 20px 8px; }
            .header { align-items: flex-start; flex-direction: column; gap: 14px; }
            .btn { width: 100%; height: 44px; }
            td:first-child { font-size: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 2s !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="header">
            <div>
                <p class="store">7-Eleven Gen. Yengco</p>
                <h1>Submitted suggestions</h1>
            </div>
            <button class="btn" id="refreshBtn" type="button">Refresh</button>
        </div>

        <p class="count" id="count" aria-live="polite"></p>

        <div class="table-responsive">
            <div id="status" class="status" role="status"></div>
            <table id="dataTable" hidden>
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyjCKDdx3_7qRRe9Z1wJA-dYPRrKOsI-psyAyQYkI3a8u6HQt_JharRlemhn3S7YBm3cA/exec';

        const refreshBtn = document.getElementById('refreshBtn');
        const statusDiv = document.getElementById('status');
        const countEl = document.getElementById('count');
        const dataTable = document.getElementById('dataTable');
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');

        function setStatus(message, type) {
            statusDiv.className = 'status' + (type ? ' ' + type : '');
            statusDiv.innerHTML = '';
            if (type === 'loading') {
                const spinner = document.createElement('span');
                spinner.className = 'spinner';
                statusDiv.appendChild(spinner);
            }
            statusDiv.appendChild(document.createTextNode(message));
            statusDiv.hidden = false;
        }

        function formatDate(value) {
            const dateObj = new Date(value);
            return isNaN(dateObj.getTime())
                ? String(value)
                : dateObj.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function fetchSheetData() {
            refreshBtn.disabled = true;
            dataTable.hidden = true;
            countEl.textContent = '';
            setStatus('Loading suggestions…', 'loading');

            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    if (!data || data.length <= 1) {
                        setStatus('No suggestions yet.');
                        return;
                    }

                    tableHeader.innerHTML = '';
                    tableBody.innerHTML = '';

                    // First row is headers
                    data[0].forEach(headerText => {
                        const th = document.createElement('th');
                        th.scope = 'col';
                        th.textContent = headerText;
                        tableHeader.appendChild(th);
                    });

                    // Remaining rows are data
                    for (let i = 1; i < data.length; i++) {
                        const tr = document.createElement('tr');

                        data[i].forEach((cellText, cellIndex) => {
                            const td = document.createElement('td');
                            // Only the first column (timestamp) is shown as a date
                            td.textContent = (cellIndex === 0 && cellText) ? formatDate(cellText) : cellText;
                            tr.appendChild(td);
                        });

                        tableBody.appendChild(tr);
                    }

                    const total = data.length - 1;
                    countEl.textContent = total + (total === 1 ? ' suggestion' : ' suggestions');
                    statusDiv.hidden = true;
                    dataTable.hidden = false;
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    setStatus('Couldn’t load suggestions. Check your connection or the script’s access settings, then refresh.', 'error');
                })
                .finally(() => {
                    refreshBtn.disabled = false;
                });
        }

        refreshBtn.addEventListener('click', fetchSheetData);

        // Load data automatically when page opens
        fetchSheetData();
    </script>
</body>
</html>
